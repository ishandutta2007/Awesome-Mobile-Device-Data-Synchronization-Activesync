<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    /* Dynamic pulsing and floating background elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(25px) translateX(-18px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateSync {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .glow-sphere-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glow-sphere-2 {
      animation: pulseGlow 9s ease-in-out infinite 2s;
      transform-origin: 1000px 250px;
    }
    .stream-line {
      stroke-dasharray: 12 12;
      animation: dataStream 6s linear infinite;
    }
    .p1 { animation: floatParticle1 6s ease-in-out infinite; }
    .p2 { animation: floatParticle2 8s ease-in-out infinite 1s; }
    .sync-icon-spin {
      animation: rotateSync 12s linear infinite;
      transform-origin: 990px 145px;
    }
  ]]></style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="80" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="glow-sphere-1" />
  <circle cx="1020" cy="220" r="180" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="glow-sphere-2" />

  <!-- Dynamic Flowing Data Streams (Behind Cards/Text) -->
  <path d="M 60,310 Q 250,260 450,290 T 850,270 T 1150,220" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="stream-line" />
  <path d="M 100,50 Q 400,90 700,50 T 1100,100" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3" class="stream-line" style="animation-duration: 9s;" />

  <!-- Floating Ambient Particles -->
  <circle cx="320" cy="90" r="3" fill="#38bdf8" class="p1" />
  <circle cx="780" cy="290" r="4" fill="#818cf8" class="p2" />
  <circle cx="860" cy="70" r="3.5" fill="#c084fc" class="p1" />
  <circle cx="160" cy="270" r="2.5" fill="#38bdf8" class="p2" />

  <!-- Interactive/Dynamic Visual Element: Sync Hub Graphic on Right Side -->
  <g transform="translate(850, 45)">
    <!-- Glass Container Card -->
    <rect x="0" y="0" width="280" height="260" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" backdrop-filter="blur(10px)" />
    
    <!-- Mini Architecture Elements -->
    <rect x="25" y="30" width="75" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="62" y="55" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Server</text>

    <rect x="180" y="30" width="75" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="217" y="55" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Device</text>

    <!-- Connection Line with Pulse -->
    <path d="M 100,51 L 180,51" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 100,51 L 180,51" stroke="#38bdf8" stroke-width="2.5" class="stream-line" />

    <!-- Center Rotating Sync Hub Icon -->
    <g class="sync-icon-spin" transform="translate(-850, -45)">
      <circle cx="990" cy="145" r="28" fill="#0f172a" stroke="url(#syncGrad)" stroke-width="2.5" filter="url(#slightGlow)" />
      <path d="M 983,137 A 10,10 0 0,1 999,139 M 999,139 L 999,134 M 999,139 L 994,139" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 997,153 A 10,10 0 0,1 981,151 M 981,151 L 981,156 M 981,151 L 986,151" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Synchronized Item Badges -->
    <rect x="30" y="195" width="65" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="62" y="212" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">✉ Mail</text>

    <rect x="107" y="195" width="78" height="26" rx="13" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1" />
    <text x="146" y="212" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle">📅 Calendar</text>

    <rect x="195" y="195" width="55" height="26" rx="13" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1" />
    <text x="222" y="212" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">👥 PIM</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Guaranteed clear & unobscured) -->
  <g transform="translate(60, 50)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8" />
    <text x="28" y="19" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#f8fafc" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome ActiveSync
    </text>

    <!-- Gradient Secondary Header -->
    <text x="0" y="132" fill="url(#syncGrad)" font-size="24" font-weight="700">
      Mobile Device Data Synchronization &amp; EAS Hub
    </text>

    <!-- Subtitle / Explanatory Description -->
    <text x="0" y="172" fill="#94a3b8" font-size="15" font-weight="400">
      A curated collection of Exchange ActiveSync (EAS) servers, enterprise SaaS gateways,
    </text>
    <text x="0" y="196" fill="#94a3b8" font-size="15" font-weight="400">
      open-source protocol bridges, and push mail/calendar/contact sync platforms.
    </text>

    <!-- Tech Specs Pills -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="17" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">EAS 2.5–16.1</text>

      <rect x="110" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="162" y="17" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Push Protocol</text>

      <rect x="225" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="287" y="17" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
